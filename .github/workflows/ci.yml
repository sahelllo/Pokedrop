name: CI

# Qualitätssicherung: Typecheck, Lint, Tests und Production-Build.
# Läuft bei jedem Push und bei jedem Pull Request.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit-Tests
        run: npm test

      - name: Production-Build (statischer Export)
        run: npm run build

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: E2E-Tests (Desktop + Mobile)
        run: npm run test:e2e

      - name: E2E-Report bei Fehlern sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Pages-Build verifizieren (mit basePath)
        env:
          GITHUB_PAGES: "true"
        run: npm run build
